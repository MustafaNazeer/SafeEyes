[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safeeyes"
version = "0.1.0"
description = "On device computer vision system that detects driver drowsiness from a cabin camera."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mustafa Nazeer" }]

# Core runtime and training dependencies for the laptop development environment.
# The perception stage relies on MediaPipe FaceMesh, OpenCV, and numpy. Models are
# trained with PyTorch, and scikit-learn provides the gradient boosted baseline for
# the temporal fatigue classifier. The lighter on device runtime for the Raspberry Pi
# is defined separately in requirements-pi.txt.
dependencies = [
    # numpy is capped below 2.5 because the 2.5 stubs use Python 3.12 type syntax,
    # which breaks mypy while python_version pins checking to the 3.11 minimum.
    "numpy>=1.26,<2.5",
    "opencv-python>=4.9",
    "mediapipe>=0.10",
    "torch>=2.2",
    "torchvision>=0.17",
    "scikit-learn>=1.4",
    # Edge export toolchain. These run on the laptop to turn trained checkpoints into
    # ONNX and int8 artifacts. The Pi runtime needs only onnxruntime (requirements-pi.txt).
    "onnx>=1.16",
    "onnxruntime>=1.17",
    "onnxscript>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
safeeyes-build-splits = "safeeyes.data.build_splits:main"
safeeyes-build-yawdd-split = "safeeyes.data.yawdd_splits:main"
safeeyes-train-eye-state = "safeeyes.models.train_eye_state:main"
safeeyes-eval-eye-state = "safeeyes.models.eval_eye_state:main"
safeeyes-train-distraction = "safeeyes.models.train_distraction:main"
safeeyes-eval-distraction = "safeeyes.models.eval_distraction:main"
safeeyes-train-frozen-distraction = "safeeyes.models.frozen_distraction:main"
safeeyes-extract-features = "safeeyes.perception.extract:main"
safeeyes-train-temporal = "safeeyes.temporal.train_temporal:main"
safeeyes-tune-temporal = "safeeyes.temporal.tune_temporal:main"
safeeyes-sweep-yawn-baseline = "safeeyes.temporal.yawn_baseline:main"
safeeyes-run = "safeeyes.alert.run:main"
safeeyes-validate-alerts = "safeeyes.alert.validation:main"
safeeyes-export-edge = "safeeyes.edge.export_models:main"
safeeyes-bench-edge = "safeeyes.edge.bench:main"
safeeyes-edge-run = "safeeyes.edge.run:main"
safeeyes-extract-interval-frames = "safeeyes.data.interval_frames:main"
safeeyes-extract-yawdd-crops = "safeeyes.data.yawdd_crops:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
safeeyes = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["safeeyes"]
mypy_path = "src"
strict = true
warn_unused_configs = true

# OpenCV, MediaPipe, scikit-learn, and the ONNX toolchain ship without type information.
[[tool.mypy.overrides]]
module = ["cv2", "mediapipe", "mediapipe.*", "sklearn.*", "onnx", "onnx.*", "onnxruntime", "onnxruntime.*", "torchvision", "torchvision.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
